name: Build and test
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: galinka
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: galinka_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galinka -d galinka_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://galinka:test-only-password@localhost:5432/galinka_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
