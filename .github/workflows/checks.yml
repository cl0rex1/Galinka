name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  voice-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t galinka-voice-test .
      - name: Recognize a Russian voice message offline in the production image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$PWD/tests/fixtures/voice-ru.webm:/test.webm:ro" \
            --entrypoint sh galinka-voice-test -ec '
              ffmpeg -v error -i /test.webm -ac 1 -ar 16000 -c:a pcm_s16le /tmp/test.wav
              whisper-cli -m "$WHISPER_MODEL" -l auto -t 2 -ng -np -nt -sns -otxt -of /tmp/result -f /tmp/test.wav
              grep -F "хорошая погода" /tmp/result.txt
            '
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: galinka
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: galinka_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galinka -d galinka_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://galinka:test-only-password@localhost:5432/galinka_test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://galinka:test-only-password@localhost:5432/galinka_test
