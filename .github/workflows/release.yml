name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:build -- --${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: matrix.target == 'win'
        run: node tests/desktop/smoke.cjs
      - if: matrix.target == 'linux'
        run: npm run arch:build
      - if: matrix.target == 'linux'
        name: Validate Arch package in pacman
        run: |
          docker run --rm -v "$PWD/release:/packages:ro" archlinux:base bash -lc 'pacman -Syu --noconfirm && pacman -U --noconfirm /packages/*.pkg.tar.zst && test -x /usr/bin/galinka && test -s /usr/lib/galinka/app.asar'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.pkg.tar.zst
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - name: Verify release APK and write checksums
        run: |
          test -n "$(find release -name '*-android-release.apk' -print -quit)"
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish installers and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Galinka $RELEASE_TAG" --notes-file docs/RELEASE.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' > /tmp/galinka-assets.txt
          for artifact in release/*; do
            if ! grep -Fxq "$(basename "$artifact")" /tmp/galinka-assets.txt; then
              gh release upload "$RELEASE_TAG" "$artifact"
            fi
          done
